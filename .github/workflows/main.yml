name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm install
      - run: npm run build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_HEALTH_CLIENT_ID: ${{ secrets.GOOGLE_HEALTH_CLIENT_ID }}
          GOOGLE_HEALTH_CLIENT_SECRET: ${{ secrets.GOOGLE_HEALTH_CLIENT_SECRET }}
          GOOGLE_HEALTH_REDIRECT_URI: ${{ secrets.GOOGLE_HEALTH_REDIRECT_URI }}
          GOOGLE_HEALTH_SCOPES: ${{ secrets.GOOGLE_HEALTH_SCOPES }}
          GOOGLE_HEALTH_API_BASE_URL: ${{ secrets.GOOGLE_HEALTH_API_BASE_URL }}
          GOOGLE_HEALTH_TOKEN_ENCRYPTION_KEY: ${{ secrets.GOOGLE_HEALTH_TOKEN_ENCRYPTION_KEY }}

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm install
      - run: npm run lint
